<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Basira — Meta authorization</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; line-height: 1.7; color: #17212b; }
    h1 { color: #066262; font-size: 1.4rem; }
    .muted { color: #5b6773; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">جارٍ إعادتك إلى بصيرة…</h1>
    <p id="msg">هذه الصفحة تعيد رمز الموافقة لمرة واحدة إلى تطبيق بصيرة على جهازك فقط (127.0.0.1). لا تُرسل أي بيانات إلى أي جهة أخرى.</p>
    <p class="muted" dir="ltr">This page only forwards the one-time authorization result to the Basira app running on this computer (127.0.0.1). It loads no external resources.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var state = q.get("state") || "";
      var m = /^(\d{2,5})\./.exec(state);
      var port = m ? parseInt(m[1], 10) : 0;
      if (!port || port < 1024 || port > 65535) {
        document.getElementById("title").textContent = "رابط غير صالح";
        document.getElementById("msg").textContent = "لم يُعثر على معرّف جلسة بصيرة في هذا الرابط. ارجع إلى بصيرة واضغط «ربط» من جديد.";
        return;
      }
      var forward = new URLSearchParams();
      ["code", "state", "error", "error_reason", "error_description"].forEach(function (k) {
        if (q.has(k)) forward.set(k, q.get(k));
      });
      window.history.replaceState(null, "", window.location.pathname);
      window.location.replace("http://127.0.0.1:" + port + "/oauth/callback/meta?" + forward.toString());
    })();
  </script>
</body>
</html>
